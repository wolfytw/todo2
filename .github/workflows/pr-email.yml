name: PR email notification

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      EMAIL_TO: wolfy@tien.tw
      PR_NUMBER: ${{ github.event.pull_request.number || 'manual-test' }}
      PR_TITLE: ${{ github.event.pull_request.title || 'Manual PR email test' }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
      PR_URL: ${{ github.event.pull_request.html_url || github.server_url }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate SMTP configuration
        shell: bash
        run: |
          missing=0
          for name in SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Send PR notification
        shell: bash
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          def clean_header(value: str) -> str:
              return " ".join(value.splitlines())

          port = int(os.environ["SMTP_PORT"])
          message = EmailMessage()
          message["Subject"] = clean_header(
              f'[PR #{os.environ["PR_NUMBER"]}] {os.environ["PR_TITLE"]}'
          )
          message["From"] = clean_header(os.environ["SMTP_FROM"])
          message["To"] = clean_header(os.environ["EMAIL_TO"])
          message.set_content(
              "A pull request needs your attention.\n\n"
              f'Repository: {os.environ["REPOSITORY"]}\n'
              f'PR: #{os.environ["PR_NUMBER"]}\n'
              f'Title: {os.environ["PR_TITLE"]}\n'
              f'Author: {os.environ["PR_AUTHOR"]}\n'
              f'URL: {os.environ["PR_URL"]}\n'
          )

          context = ssl.create_default_context()
          if port == 465:
              with smtplib.SMTP_SSL(os.environ["SMTP_HOST"], port, context=context) as smtp:
                  smtp.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(os.environ["SMTP_HOST"], port) as smtp:
                  smtp.starttls(context=context)
                  smtp.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
                  smtp.send_message(message)
          PY

